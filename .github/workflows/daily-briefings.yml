name: Publish daily evidence briefings
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/collect-briefings.mjs', '.github/workflows/daily-briefings.yml']
permissions:
  contents: write
concurrency:
  group: prism-daily-briefings
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node scripts/collect-briefings.mjs
      - name: Commit verified archive
        run: |
          git config user.name "PRISM briefing bot"
          git config user.email "prism-briefings@users.noreply.github.com"
          git add data/daily-briefings.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh daily source-backed briefing archive"
            git push origin HEAD:main
          fi
